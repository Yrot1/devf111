[pytest]
# 把 backend/ 目录加入 sys.path，这样无论用 `pytest` 还是 `python -m pytest`，
# 都能 `import app`（项目没有 app/__init__.py，也不会打包安装，必须显式声明）。
pythonpath = .

# 不传路径时默认只收集测试目录，避免把 .venv、.data 等扫进来。
testpaths = app/tests

# 消除 pytest-asyncio 每次运行都刷屏的 PytestDeprecationWarning。
asyncio_default_fixture_loop_scope = function
